<!doctype html>
<html lang="ru">
  <head>
    <meta charset="utf-8">
    <title>{{ event.title }}</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  </head>
  <body class="py-5">
    <div class="container">
      <a href="{% url 'event_list' %}" class="btn btn-outline-secondary mb-4">← Назад</a>
      {% if event.poster %}
        <img src="{{ event.poster.url }}" class="img-fluid mb-4" alt="{{ event.title }}">
      {% endif %}
      <h1>{{ event.title }}</h1>
      <p class="text-muted">{{ event.date }}</p>
      <p class="lead">{{ event.summary }}</p>
      <p>{{ event.description }}</p>
    </div>
  </body>
</html>
