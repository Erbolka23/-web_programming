{% extends 'base.html' %}

{% block title %}Удалить {{ event.title }}{% endblock %}

{% block content %}
<div class="row justify-content-center">
  <div class="col-lg-7">
    <p class="eyebrow">Удаление события</p>
    <h1 class="display-title mb-3">Удалить «{{ event.title }}»?</h1>
    <p class="text-secondary mb-4">Это действие нельзя отменить.</p>
    <form method="post" class="d-flex gap-2">
      {% csrf_token %}
      <button class="btn btn-danger" type="submit">Удалить событие</button>
      <a class="btn btn-outline-secondary" href="{{ event.get_absolute_url }}">Отмена</a>
    </form>
  </div>
</div>
{% endblock %}
